name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: sproutroll-jungle-glow-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # Also commit the APK straight into a dedicated branch. Some sandboxed
      # environments can't reach the Azure blob storage host that workflow
      # artifact downloads redirect to, but plain `git fetch` against
      # GitHub itself always works - so this is the reliable way to pull
      # the built binary back down.
      - name: Publish APK to apk-builds branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/apk-out
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/apk-out/sproutroll-jungle-glow.apk
          git checkout --orphan apk-builds-tmp
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p dist
          cp /tmp/apk-out/sproutroll-jungle-glow.apk dist/sproutroll-jungle-glow.apk
          echo "Built from commit ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/BUILD_INFO.txt
          git add dist
          git commit -m "Build APK from ${GITHUB_SHA}"
          git branch -D apk-builds 2>/dev/null || true
          git branch -m apk-builds
          git push origin apk-builds --force
